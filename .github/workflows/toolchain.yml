name: Build PS4 toolchain image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ps4-payload-toolchain:latest
        run: |
          docker build --progress=plain -f toolchain/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
